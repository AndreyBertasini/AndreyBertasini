<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Events → Kafka → ClickHouse → dbt → Decision">
  <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes flow { from { stroke-dashoffset: 48 } to { stroke-dashoffset: 0 } }
    .flow { animation: flow 1.4s linear infinite; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
  </style>
  <rect width="1200" height="230" rx="16" fill="#121316"/>
  <rect x="0.5" y="0.5" width="1199" height="229" rx="16" fill="none" stroke="#22242a"/>
  <line x1="40" y1="40" x2="1160" y2="40" stroke="#2a2c32" stroke-width="2"/>
  <line class="flow" x1="40" y1="40" x2="1160" y2="40" stroke="#d9f26a" stroke-width="2" stroke-dasharray="10 38"/>
  <g transform="translate(40 64)">
    <rect width="208" height="140" rx="10" fill="#17181c" stroke="#2a2c32"/>
    <text x="18" y="30" class="mono" font-size="12" letter-spacing="1" fill="#8d8e87">01 · SOURCES</text>
    <text x="18" y="72" class="serif" font-size="32" fill="#ecebe4">Events</text>
    <text x="18" y="102" class="sans" font-size="13" fill="#a4a59e">App, web, CRM, CDC</text>
    <text x="18" y="120" class="sans" font-size="13" fill="#a4a59e">from operational DBs</text>
  </g>
  <g transform="translate(268 64)">
    <rect width="208" height="140" rx="10" fill="#17181c" stroke="#2a2c32"/>
    <text x="18" y="30" class="mono" font-size="12" letter-spacing="1" fill="#8d8e87">02 · STREAM</text>
    <text x="18" y="72" class="serif" font-size="32" fill="#ecebe4">Kafka</text>
    <text x="18" y="102" class="sans" font-size="13" fill="#a4a59e">Versioned schemas,</text>
    <text x="18" y="120" class="sans" font-size="13" fill="#a4a59e">delivery guarantees</text>
  </g>
  <g transform="translate(496 64)">
    <rect width="208" height="140" rx="10" fill="#d9f26a"/>
    <text x="18" y="30" class="mono" font-size="12" letter-spacing="1" fill="#3b4214">03 · OLAP</text>
    <text x="18" y="72" class="serif" font-size="32" fill="#0d0e10">ClickHouse</text>
    <text x="18" y="102" class="sans" font-size="13" fill="#2a2f10">MergeTree and materialized</text>
    <text x="18" y="120" class="sans" font-size="13" fill="#2a2f10">views built around queries</text>
  </g>
  <g transform="translate(724 64)">
    <rect width="208" height="140" rx="10" fill="#17181c" stroke="#2a2c32"/>
    <text x="18" y="30" class="mono" font-size="12" letter-spacing="1" fill="#8d8e87">04 · MODELS</text>
    <text x="18" y="72" class="serif" font-size="32" fill="#ecebe4">dbt</text>
    <text x="18" y="102" class="sans" font-size="13" fill="#a4a59e">Tested transformations,</text>
    <text x="18" y="120" class="sans" font-size="13" fill="#a4a59e">semantic layer</text>
  </g>
  <g transform="translate(952 64)">
    <rect width="208" height="140" rx="10" fill="#17181c" stroke="#2a2c32"/>
    <text x="18" y="30" class="mono" font-size="12" letter-spacing="1" fill="#8d8e87">05 · ACTION</text>
    <text x="18" y="72" class="serif" font-size="32" font-style="italic" fill="#d9f26a">Decision</text>
    <text x="18" y="102" class="sans" font-size="13" fill="#a4a59e">Dashboards, alerts, reverse</text>
    <text x="18" y="120" class="sans" font-size="13" fill="#a4a59e">ETL to the teams</text>
  </g>
</svg>
