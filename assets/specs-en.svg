<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="EXPERIENCE: 15+ years · CERTIFICATION: ClickHouse · Confluent · SPECIALTY: Real-time · STACK: Kafka · dbt">
