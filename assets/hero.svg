<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Andrii Dyshkantiuk · Analytics Engineer — Dati in tempo reale. Decisioni senza attesa.">
  <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes flow { from { stroke-dashoffset: 40 } to { stroke-dashoffset: 0 } }
    .flow { animation: flow 1.6s linear infinite; }
  </style>
  <rect width="1200" height="400" rx="16" fill="#0d0e10"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="#22242a"/>
  <circle class="pulse" cx="62" cy="74" r="5" fill="#d9f26a"/>
  <text x="80" y="79" class="mono" font-size="14" letter-spacing="1.4" fill="#8d8e87">ANDRII DYSHKANTIUK · ANALYTICS ENGINEER</text>
  <text x="56" y="190" class="serif" font-size="82" fill="#ecebe4">Dati in tempo reale.</text>
  <text x="56" y="282" class="serif" font-size="82" fill="#ecebe4"><tspan font-style="italic" fill="#d9f26a">Decisioni</tspan> senza attesa.</text>
  <text x="58" y="340" class="sans" font-size="19" fill="#a4a59e">Data analytics · Analytics engineering · Real-time analytics — certificato ClickHouse e Confluent.</text>
  <line x1="56" y1="366" x2="1144" y2="366" stroke="#22242a"/>
  <line class="flow" x1="56" y1="366" x2="1144" y2="366" stroke="#d9f26a" stroke-width="1.5" stroke-dasharray="6 34" opacity=".7"/>
  <text x="1144" y="79" text-anchor="end" class="mono" font-size="14" fill="#d9f26a">2026</text>
</svg>
