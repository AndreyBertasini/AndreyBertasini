<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="{{ARIA}}">
  <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .r1 { animation: rise .7s ease-out both; }
    .r2 { animation: rise .7s .15s ease-out both; }
    .r3 { animation: rise .7s .3s ease-out both; }
    @keyframes flow { from { stroke-dashoffset: 40 } to { stroke-dashoffset: 0 } }
    .flow { animation: flow 1.6s linear infinite; }
  </style>
  <defs>
    <clipPath id="pc"><rect x="852" y="44" width="300" height="375" rx="12"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".6" stop-color="#0d0e10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0e10" stop-opacity=".75"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" rx="16" fill="#0d0e10"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="16" fill="none" stroke="#22242a"/>

  <circle class="pulse" cx="54" cy="82" r="5" fill="#d9f26a"/>
  <text x="72" y="87" class="mono" font-size="14" letter-spacing="1.4" fill="#8d8e87">{{EYEBROW}}</text>
  <g class="r1"><text x="48" y="198" class="serif" font-size="{{FS}}" fill="#ecebe4">{{H1A}}</text></g>
  <g class="r2"><text x="48" y="282" class="serif" font-size="{{FS}}" fill="#ecebe4"><tspan font-style="italic" fill="#d9f26a">{{H1EM}}</tspan>{{H1B}}</text></g>
  <g class="r3">
    <text x="50" y="340" class="sans" font-size="19" fill="#a4a59e">{{LEAD1}}</text>
    <text x="50" y="368" class="sans" font-size="19" fill="#a4a59e">{{LEAD2}}</text>
  </g>
  <line x1="48" y1="419" x2="804" y2="419" stroke="#22242a"/>
  <line class="flow" x1="48" y1="419" x2="804" y2="419" stroke="#d9f26a" stroke-width="1.5" stroke-dasharray="6 34" opacity=".7"/>

  <rect x="851.5" y="43.5" width="301" height="376" rx="12.5" fill="#17181c" stroke="#2a2c32"/>
  <image x="852" y="44" width="300" height="375" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc)" href="{{IMG}}" xlink:href="{{IMG}}"/>
  <rect x="852" y="44" width="300" height="375" rx="12" fill="url(#fade)"/>
  <text x="852" y="446" class="mono" font-size="12" letter-spacing="1" fill="#8d8e87">CLICKHOUSE · CONFLUENT CERTIFIED</text>
  <text x="1152" y="446" text-anchor="end" class="mono" font-size="12" fill="#d9f26a">2026</text>
</svg>
